events {}

http {
    upstream scn {
        server controller-a:7878;
        server controller-b:7878;
        keepalive 16;
    }

    server {
        listen 7878;
        client_max_body_size 32m;

        location / {
            proxy_pass http://scn;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_next_upstream off;
        }
    }
}
