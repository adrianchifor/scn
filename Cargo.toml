[package]
name = "scn"
version = "0.1.0"
edition = "2024"
description = "Scalable source control system in Rust, inspired by Scion"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
globset = "0.4"
ignore = "0.4"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
redis = { version = "1", default-features = false, features = ["script"] }
rust-s3 = { version = "0.38", default-features = false, features = ["sync-rustls-tls", "fail-on-err"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
similar = "3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
zstd = { version = "0.14", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

